<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>番茄钟 · 专注计时器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <section class="hero-card">
        <div class="eyebrow">Pomodoro Focus</div>
        <h1 id="app-title">番茄钟</h1>
        <p class="subtitle">25 分钟专注，5 分钟休息。用清晰的节奏把任务一颗颗完成。</p>

        <div class="mode-tabs" role="tablist" aria-label="计时模式">
          <button class="mode-tab active" data-mode="focus" role="tab" aria-selected="true">专注</button>
          <button class="mode-tab" data-mode="short" role="tab" aria-selected="false">短休息</button>
          <button class="mode-tab" data-mode="long" role="tab" aria-selected="false">长休息</button>
        </div>

        <div class="timer" aria-live="polite">
          <div class="progress-ring" aria-hidden="true">
            <svg viewBox="0 0 220 220">
              <circle class="track" cx="110" cy="110" r="96" />
              <circle class="progress" cx="110" cy="110" r="96" />
            </svg>
            <div class="timer-face">
              <span id="time-display">25:00</span>
              <small id="mode-label">专注时间</small>
            </div>
          </div>
        </div>

        <div class="controls" aria-label="计时控制">
          <button id="start-pause" class="primary">开始</button>
          <button id="reset" class="secondary">重置</button>
        </div>
      </section>

      <aside class="task-card" aria-labelledby="task-title">
        <h2 id="task-title">今日任务</h2>
        <form id="task-form" class="task-form">
          <label for="task-input" class="sr-only">添加任务</label>
          <input id="task-input" type="text" placeholder="写下一个专注任务…" maxlength="48" autocomplete="off" />
          <button type="submit">添加</button>
        </form>
        <ul id="task-list" class="task-list" aria-label="任务列表"></ul>
        <div class="stats">
          <div>
            <strong id="round-count">0</strong>
            <span>完成番茄</span>
          </div>
          <div>
            <strong id="task-count">0</strong>
            <span>剩余任务</span>
          </div>
        </div>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
